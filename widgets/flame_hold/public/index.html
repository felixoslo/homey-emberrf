<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {color-scheme:light dark}
  body{font-family:system-ui,sans-serif;margin:0;padding:12px}
  h2{font-size:15px;margin:0 0 10px;font-weight:650}
  .buttons{display:flex;gap:10px}
  button{flex:1;min-height:65px;touch-action:none;user-select:none;
    border:1px solid #8886;border-radius:12px;background:#ed7d2a;color:white;
    font-size:16px;font-weight:700}
  button.down{background:#415a77}
  button:disabled{opacity:.45}
  button.active{filter:brightness(.75);outline:3px solid currentColor}
  #status{min-height:30px;font-size:12px;margin:9px 0 0}
</style>
</head>
<body>
<h2>EmberRF – hold inne for flammejustering</h2>
<div class="buttons">
  <button id="up" type="button" data-direction="flame_up">▲ Flamme opp</button>
  <button id="down" class="down" type="button" data-direction="flame_down">▼ Flamme ned</button>
</div>
<p id="status" role="status" aria-live="polite">Hold inne for å sende RF. Slipp for å stoppe. Maks 8 sekunder.</p>
<script>
function onHomeyReady(Homey) {
  const status = document.getElementById('status');
  const buttons = [...document.querySelectorAll('button[data-direction]')];
  const deviceId = Homey.getDeviceIds()[0];
  let active = null;
  let pressed = false;
  let startPromise = null;
  let timer = null;
  let stopping = false;
  if (!deviceId) {
    status.textContent = 'Velg EmberRF-peisen i innstillingene for widgeten.';
    buttons.forEach(button => button.disabled = true);
    Homey.ready();
    return;
  }
  function setState(on) {
    buttons.forEach(b => b.classList.toggle('active', on && active && b.dataset.direction === active.direction));
  }
  async function endHold() {
    pressed = false;
    if (timer) clearInterval(timer);
    timer = null;
    setState(false);
    if (!active || stopping) return;
    stopping = true;
    const session = active.session;
    try {
      if (startPromise) await startPromise.catch(() => {});
      await Homey.api('POST', '/hold/stop', {device_id:deviceId,session});
      status.textContent = 'Stoppet. Klar for neste justering.';
    } catch (err) {
      status.textContent = 'Stoppsignal feilet. Serverens sikkerhetsgrense stopper sendingen automatisk.';
    } finally {
      active = null;
      startPromise = null;
      stopping = false;
    }
  }
  function beginHold(event) {
    if (event.button !== undefined && event.button !== 0) return;
    if (active || stopping) return;
    event.preventDefault();
    pressed = true;
    // Opaque per-press session ID prevents stale STOP from ending a later hold.
    const session = String(Date.now()) + '-' + Math.random().toString(36).slice(2);
    const direction = event.currentTarget.dataset.direction;
    active = {session,direction};
    try { event.currentTarget.setPointerCapture(event.pointerId); } catch (_) {}
    setState(true);
    status.textContent = 'Justerer flammen – hold inne …';
    startPromise = Homey.api('POST','/hold/start',{device_id:deviceId,direction,session});
    startPromise.then(result => {
      if (!result || result.active !== true) throw new Error('Start was not accepted');
      if (!pressed) { void endHold(); return; }
      timer = setInterval(async () => {
        if (!active || !pressed || stopping) return;
        try {
          const ping = await Homey.api('POST','/hold/heartbeat',{device_id:deviceId,session});
          if (ping.active === false) {
            status.textContent='Sendingen er avsluttet av tidsgrensen. Slipp og trykk på nytt.';
            await endHold();
          }
        } catch (_) {
          // Server will stop after heartbeat timeout. Never continue blindly.
          await endHold();
        }
      }, 350);
    }).catch(err => {
      status.textContent = 'Kunne ikke starte flammestyring: ' + String(err?.message || err);
      void endHold();
    });
  }
  buttons.forEach(button => {
    button.addEventListener('pointerdown',beginHold);
    button.addEventListener('pointerup', () => { void endHold(); });
    button.addEventListener('pointercancel', () => { void endHold(); });
    button.addEventListener('lostpointercapture', () => { if (pressed) void endHold(); });
  });
  window.addEventListener('blur', () => {void endHold();});
  window.addEventListener('pagehide', () => {void endHold();});
  document.addEventListener('visibilitychange', () => {if (document.hidden) void endHold();});
  Homey.ready({height:175});
}
</script>
</body>
</html>
